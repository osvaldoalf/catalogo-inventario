<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo de inventario</title><style>body{margin:0;background:#f4f6f3;color:#17221e;font-family:Arial,sans-serif}.top{background:#183b35;color:white;padding:25px 18px}.wrap{max-width:1100px;margin:auto}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.controls input,.controls select{padding:12px;border:1px solid #ccd5cf;border-radius:9px;flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.card{background:white;border:1px solid #dfe6e0;border-radius:14px;overflow:hidden}.photo{height:190px;background:#e9eee9;display:flex;align-items:center;justify-content:center}.photo img{width:100%;height:100%;object-fit:contain}.body{padding:14px}.category{color:#557168;font-size:12px;font-weight:bold;text-transform:uppercase}.body h2{font-size:18px;margin:7px 0}.desc{color:#65716c;font-size:13px}.price{font-weight:bold;font-size:21px;margin:12px 0 6px}.meta{font-size:13px;line-height:1.8}.detail{max-width:760px;margin:20px auto;padding:12px}.product-only .top,.product-only footer{display:none}.product-only{background:#fff}.product-only .detail{max-width:680px;margin:0 auto;padding:18px}.product-only .detail .card{display:flex;flex-direction:column;border:0;border-radius:0;box-shadow:none}.product-only .detail .photo{height:auto;min-height:0;background:#fff;padding:8px}.product-only .detail .photo img{width:100%;height:auto;max-height:65vh;object-fit:contain}.product-only .detail .body{padding:18px 8px}.product-only .detail .category{display:none}.product-only .detail .body h2{font-size:25px;margin:0 0 12px}.product-only .detail .desc{font-size:16px;color:#333;margin-bottom:14px}.product-only .detail .price{font-size:23px}.product-only .back{display:none}.detail .card{display:grid;grid-template-columns:1fr 1fr}.detail .photo{height:100%;min-height:300px}.back{display:inline-block;margin:15px 0;color:#183b35}footer{text-align:center;color:#65716c;padding:24px;font-size:12px}@media(max-width:560px){.detail .card{display:block}.detail .photo{height:250px;min-height:0}}</style></head><body><header class="top"><div class="wrap"><h1>Catálogo de inventario</h1><p>Consulta las fotografías, códigos, cantidades y precios.</p></div></header><main class="wrap" id="app"><div class="controls"><input id="search" placeholder="Buscar producto o código"><select id="category"><option value="">Todas las categorías</option></select></div><p id="count"></p><div class="grid" id="grid"></div></main><footer>Catálogo público de productos</footer><script>let products=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>{let n=Number(v);return v!==''&&v!==null&&Number.isFinite(n)?n.toLocaleString('es-MX',{style:'currency',currency:'MXN'}):(v||'No disponible')};function card(p,detail=false){return `<article class="card"><div class="photo">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}">`:'Sin fotografía'}</div><div class="body"><div class="category">${esc(p.category)}</div><h2>${esc(p.name)}</h2><div class="desc">${esc(p.description)}</div><div class="price">${money(p.price)}</div><div class="meta"><b>Código:</b> ${esc(p.barcode||p.id)}<br><b>Cantidad:</b> ${esc(p.quantity)} ${esc(p.unit)}${p.expiration&&p.expiration!=='No aplica'?`<br><b>Caducidad:</b> ${esc(p.expiration)}`:''}</div>${detail?'':`<p><a href="?id=${encodeURIComponent(p.id)}">Ver ficha →</a></p>`}</div></article>`}async function init(){products=await (await fetch('./products.json')).json();let id=new URLSearchParams(location.search).get('id');if(id){let p=products.find(x=>String(x.id)===id);document.body.classList.add('product-only');document.querySelector('#app').innerHTML=p?`<div class="detail">${card(p,true)}</div>`:'<p style="padding:24px">No se encontró el producto.</p>';document.title=p?p.name:'Producto no encontrado';return}let sel=document.querySelector('#category');[...new Set(products.map(p=>p.category))].forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;sel.append(o)});function render(){let q=document.querySelector('#search').value.toLowerCase(),cat=sel.value;let list=products.filter(p=>(!cat||p.category===cat)&&[p.name,p.id,p.barcode,p.description,p.category].join(' ').toLowerCase().includes(q));document.querySelector('#count').textContent=list.length+' de '+products.length+' productos';document.querySelector('#grid').innerHTML=list.map(p=>card(p)).join('')}document.querySelector('#search').addEventListener('input',render);sel.addEventListener('change',render);render()}init().catch(()=>document.querySelector('#app').textContent='No se pudo cargar el catálogo.');</script></body></html>
