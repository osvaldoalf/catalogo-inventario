<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183b35"><title>Catálogo de inventario</title><style>
:root{--green:#183b35;--bg:#f4f6f3;--card:#fff;--muted:#65716c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#17221e;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.top{background:var(--green);color:white;padding:28px 18px 22px}.wrap{max-width:1100px;margin:auto}.top h1{margin:0 0 6px;font-size:clamp(24px,4vw,36px)}.top p{margin:0;color:#d6e5df}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.controls input,.controls select{border:1px solid #d5ddd7;border-radius:10px;padding:12px;background:white;font:inherit;flex:1;min-width:180px}.count{color:var(--muted);font-size:14px;margin:8px 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.card{background:var(--card);border:1px solid #e1e7e2;border-radius:15px;overflow:hidden;box-shadow:0 2px 8px #14281a0b}.photo{height:190px;background:#e9eee9;display:flex;align-items:center;justify-content:center}.photo img{width:100%;height:100%;object-fit:contain}.noimg{color:#8a968e}.body{padding:14px}.category{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#557168;font-weight:700}.body h2{font-size:18px;margin:5px 0 8px}.desc{font-size:13px;color:var(--muted);min-height:34px}.price{font-weight:750;font-size:21px;margin:12px 0 6px}.meta{font-size:13px;color:#3f4d46;line-height:1.7}.detail{max-width:760px;margin:24px auto;padding:18px}.detail .card{display:grid;grid-template-columns:minmax(220px,1fr) minmax(220px,1fr)}.detail .photo{height:100%;min-height:320px}.back{display:inline-block;margin:18px 0;color:var(--green);font-weight:650;text-decoration:none}.empty{padding:35px;text-align:center;color:var(--muted)}footer{text-align:center;color:var(--muted);padding:28px 12px;font-size:12px}@media(max-width:560px){.detail .card{display:block}.detail .photo{height:260px;min-height:0}}
</style></head><body><header class="top"><div class="wrap"><h1>Catálogo de inventario</h1><p>Consulta productos, fotografías, cantidades y precios.</p></div></header><main class="wrap" id="app"><div class="controls"><input id="search" placeholder="Buscar producto o código…" aria-label="Buscar"><select id="category" aria-label="Filtrar categoría"><option value="">Todas las categorías</option></select></div><div class="count" id="count"></div><div class="grid" id="grid"></div></main><footer>Catálogo de productos · Información publicada para consulta</footer><script>
let products=[];const money=v=>{const n=Number(v);return v!==''&&v!==null&&Number.isFinite(n)?n.toLocaleString('es-MX',{style:'currency',currency:'MXN'}):(v||'No disponible')};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function card(p,detail=false){return `<article class="card"><div class="photo">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}">`:'<span class="noimg">Sin fotografía</span>'}</div><div class="body"><div class="category">${esc(p.category)}</div><h2>${esc(p.name)}</h2>${p.description?`<div class="desc">${esc(p.description)}</div>`:''}<div class="price">${money(p.price)}</div><div class="meta"><b>Código:</b> ${esc(p.barcode||p.id)}<br><b>Cantidad:</b> ${esc(p.quantity)} ${esc(p.unit)}${p.expiration&&p.expiration!=='No aplica'?`<br><b>Caducidad:</b> ${esc(p.expiration)}`:''}</div>${!detail?`<p><a href="?id=${encodeURIComponent(p.id)}">Ver ficha del producto →</a></p>`:''}</div></article>`}async function init(){const res=await fetch('./products.json');products=await res.json();const params=new URLSearchParams(location.search),id=params.get('id');if(id){const p=products.find(x=>String(x.id)===id);document.querySelector('#app').innerHTML=p?`<div class="detail"><a class="back" href="./">← Ver todo el catálogo</a>${card(p,true)}</div>`:'<div class="empty">No se encontró ese producto.</div>';document.title=p?p.name+' · Catálogo':'Producto no encontrado';return}const sel=document.querySelector('#category');[...new Set(products.map(p=>p.category))].forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;sel.append(o)});function render(){const q=document.querySelector('#search').value.toLowerCase(),cat=sel.value;const list=products.filter(p=>(!cat||p.category===cat)&&[p.name,p.id,p.barcode,p.description,p.category].join(' ').toLowerCase().includes(q));document.querySelector('#count').textContent=`${list.length} de ${products.length} productos`;document.querySelector('#grid').innerHTML=list.map(p=>card(p)).join('')||'<div class="empty">No se encontraron productos.</div>'}document.querySelector('#search').addEventListener('input',render);sel.addEventListener('change',render);render()}init().catch(()=>{document.querySelector('#app').innerHTML='<p>No se pudo cargar el catálogo. Comprueba que los archivos estén publicados juntos.</p>'});
</script></body></html>
